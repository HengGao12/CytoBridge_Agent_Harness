model:
  components: ['velocity', 'score']
  velocity_net:
    hidden_dim: 256
    n_layers: 5
    residual: false
  score_net:
    hidden_dim: 256
    n_layers: 4

ckpt_dir: 'results'

training:
  defaults:
    lr: 0.0001
    lambda_ot: 1.0
    lambda_mass: 0.1
    lambda_energy: 0.01
    sigma: 0.05
    batch_size: 400

  plan:
    - name: "Train_FM"
      mode: "flow_matching"
      lr: 0.005
      epochs: 3000
      sigma: 0.05
      train_strategy: "v+s"
      batch_size: 400
      scheduler_type: cosine
      save_strategy: "best"
      flow_matching:
        backend: "sf2m"
        lambda_penalty: 1
        coupling:
          # Practical SF2M follows the reference implementation's exact OT
          # default; chunked minibatch keeps large datasets tractable.
          method: "exact"
          reg: 0.005
          use_mini_batch: true
          chunk_size: 1000
          normalize_cost: false
        path:
          sigma: 0.05
