model:
  components: ['velocity', 'growth']
  velocity_net:
    hidden_dim: 256
    n_layers: 5
    residual: false
  growth_net:
    hidden_dim: 256
    n_layers: 5
    residual: false

ckpt_dir: 'results'

training:
  defaults:
    lr: 0.0001
    lambda_ot: 1.0
    lambda_mass: 0.1
    lambda_energy: 0.01
    sigma: 0.0
    batch_size: 400

  plan:
    - name: "Train_FM"
      mode: "flow_matching"
      lr: 0.005
      epochs: 3000
      sigma: 0.0
      train_strategy: "v+g"
      batch_size: 400
      scheduler_type: cosine
      save_strategy: "best"
      flow_matching:
        backend: "vgfm"
        lambda_penalty: 0
        coupling:
          use_mini_batch: true
          chunk_size: 1000
          alpha_regm: 1.0
          reg_strategy: "max_over_time"
        path:
          sigma: 0.0
        mass:
          kind: "uot"
